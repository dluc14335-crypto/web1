<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GRX Key System</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #18234a, #070914 55%, #03040a);
    color: white;
}

.container {
    width: 420px;
    max-width: 92%;
    padding: 35px;
    border-radius: 22px;
    background: rgba(12, 15, 30, 0.95);
    border: 1px solid rgba(100, 120, 255, 0.35);
    box-shadow: 0 0 40px rgba(50, 70, 255, 0.25);
}

.logo {
    text-align: center;
    font-size: 34px;
    font-weight: 900;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #9ca3af;
    margin-bottom: 30px;
}

.question {
    font-size: 22px;
    text-align: center;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #30364f;
    background: #0b0e1b;
    color: white;
    outline: none;
    text-align: center;
    font-size: 18px;
}

input:focus {
    border-color: #5865f2;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(90deg, #5865f2, #7c3aed);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.hidden {
    display: none;
}

.loading-title {
    text-align: center;
    font-size: 22px;
    margin-bottom: 20px;
}

.progress {
    width: 100%;
    height: 14px;
    background: #171a2a;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #5865f2, #a855f7);
    transition: width 1s linear;
}

.percent {
    text-align: center;
    margin-top: 15px;
    color: #a5b4fc;
}

.key-box {
    margin-top: 20px;
    padding: 18px;
    background: #080b16;
    border: 1px solid #5865f2;
    border-radius: 12px;
    text-align: center;
    font-size: 21px;
    font-weight: bold;
    word-break: break-all;
    color: #8ea0ff;
}

.copy {
    margin-top: 12px;
}

.status {
    text-align: center;
    margin-top: 15px;
    color: #9ca3af;
    font-size: 14px;
}

.error {
    color: #ff6b6b;
}

.success {
    color: #57f287;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">GRX</div>

    <div class="subtitle">Key System</div>

    <!-- QUESTION -->
    <div id="questionBox">

        <div class="question">
            1 + 1 bằng bao nhiêu?
        </div>

        <input
            id="answer"
            type="number"
            placeholder="Nhập đáp án"
            autocomplete="off"
        >

        <button
            id="answerButton"
            onclick="checkAnswer()"
        >
            Xác nhận
        </button>

        <div
            id="questionStatus"
            class="status"
        ></div>

    </div>

    <!-- LOADING -->
    <div
        id="loadingBox"
        class="hidden"
    >

        <div class="loading-title">
            ⚡ Đang tạo Key...
        </div>

        <div class="progress">
            <div
                id="progressBar"
                class="progress-bar"
            ></div>
        </div>

        <div
            id="percent"
            class="percent"
        >
            0%
        </div>

        <div
            id="loadingStatus"
            class="status"
        >
            Vui lòng chờ...
        </div>

    </div>

    <!-- RESULT -->
    <div
        id="resultBox"
        class="hidden"
    >

        <div class="loading-title">
            ✅ Tạo Key thành công
        </div>

        <div
            id="key"
            class="key-box"
        ></div>

        <button
            id="copyButton"
            class="copy"
            onclick="copyKey()"
        >
            📋 Sao chép Key
        </button>

        <div
            id="copyStatus"
            class="status"
        ></div>

        <div class="status">
            Key có hiệu lực trong 10 phút.
        </div>

    </div>

</div>

<script>

/*
====================================================
GRX KEY SYSTEM
====================================================

QUAN TRỌNG:
Thay URL bên dưới bằng URL Web Service THẬT
của bạn trên Render.

Ví dụ:

https://grx-key-system.onrender.com

KHÔNG thêm /api/get-key ở đây.
Code bên dưới sẽ tự thêm.
====================================================
*/

const API_URL = "https://YOUR-API-NAME.onrender.com";


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer() {

    const answer =
        document
            .getElementById("answer")
            .value
            .trim();

    const status =
        document.getElementById("questionStatus");

    if (answer !== "2") {

        status.textContent =
            "❌ Đáp án chưa đúng.";

        status.className =
            "status error";

        return;
    }

    status.textContent = "";

    document
        .getElementById("answerButton")
        .disabled = true;

    document
        .getElementById("questionBox")
        .classList.add("hidden");

    document
        .getElementById("loadingBox")
        .classList.remove("hidden");

    startLoading();
}


/* =========================
   60 SECOND LOADING
========================= */

function startLoading() {

    let seconds = 0;

    const total = 60;

    const bar =
        document.getElementById("progressBar");

    const percent =
        document.getElementById("percent");

    const status =
        document.getElementById("loadingStatus");

    const timer =
        setInterval(async () => {

            seconds++;

            const value =
                Math.min(
                    100,
                    Math.floor(
                        (seconds / total) * 100
                    )
                );

            bar.style.width =
                value + "%";

            percent.textContent =
                value + "%";

            status.textContent =
                `Đang xử lý... ${seconds}/${total} giây`;

            if (seconds >= total) {

                clearInterval(timer);

                status.textContent =
                    "🔑 Đang liên hệ máy chủ Key...";

                await getKey();
            }

        }, 1000);
}


/* =========================
   GET KEY
========================= */

async function getKey() {

    const status =
        document.getElementById("loadingStatus");

    try {

        /*
        Kiểm tra URL API trước.
        */
        if (
            !API_URL ||
            API_URL.includes("YOUR-API-NAME")
        ) {

            throw new Error(
                "Bạn chưa thay API_URL bằng URL Render thật."
            );
        }

        /*
        Xóa dấu / cuối URL nếu có.
        */
        const baseURL =
            API_URL.replace(/\/+$/, "");

        const apiURL =
            baseURL + "/api/get-key";

        console.log(
            "GRX API:",
            apiURL
        );

        status.textContent =
            "🔗 Đang kết nối máy chủ...";

        const controller =
            new AbortController();

        const timeout =
            setTimeout(() => {
                controller.abort();
            }, 20000);

        let response;

        try {

            response =
                await fetch(apiURL, {
                    method: "GET",
                    headers: {
                        "Accept": "application/json"
                    },
                    cache: "no-store",
                    signal: controller.signal
                });

        } finally {

            clearTimeout(timeout);
        }

        if (!response.ok) {

            throw new Error(
                `API trả về HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        console.log(
            "GRX API response:",
            data
        );

        if (
            !data ||
            typeof data.key !== "string" ||
            !data.key.trim()
        ) {

            throw new Error(
                "API không trả về Key hợp lệ."
            );
        }

        /*
        Hiển thị kết quả.
        */
        document
            .getElementById("loadingBox")
            .classList.add("hidden");

        document
            .getElementById("resultBox")
            .classList.remove("hidden");

        document
            .getElementById("key")
            .textContent =
                data.key;

    } catch (error) {

        console.error(
            "GRX API ERROR:",
            error
        );

        let message =
            "❌ Không thể kết nối API.";

        if (error.name === "AbortError") {

            message =
                "❌ API phản hồi quá lâu.";

        } else if (
            error.message &&
            error.message.includes("YOUR-API-NAME")
        ) {

            message =
                "❌ Bạn chưa nhập URL Render.";

        } else if (
            error.message
        ) {

            message =
                "❌ API lỗi: " +
                error.message;
        }

        status.textContent =
            message;

        status.className =
            "status error";

        /*
        Hiển thị thêm trong Console
        để dễ kiểm tra nếu có lỗi.
        */
        console.error(
            "API URL:",
            API_URL
        );
    }
}


/* =========================
   COPY KEY
========================= */

async function copyKey() {

    const key =
        document
            .getElementById("key")
            .textContent
            .trim();

    const status =
        document.getElementById("copyStatus");

    if (!key) {

        status.textContent =
            "❌ Không có Key để sao chép.";

        status.className =
            "status error";

        return;
    }

    try {

        await navigator.clipboard.writeText(
            key
        );

        status.textContent =
            "✅ Đã sao chép Key!";

        status.className =
            "status success";

    } catch (error) {

        console.error(
            "Copy error:",
            error
        );

        /*
        Fallback cho một số trình duyệt.
        */
        try {

            const textarea =
                document.createElement("textarea");

            textarea.value = key;

            textarea.style.position =
                "fixed";

            textarea.style.opacity =
                "0";

            document.body.appendChild(
                textarea
            );

            textarea.focus();

            textarea.select();

            document.execCommand(
                "copy"
            );

            textarea.remove();

            status.textContent =
                "✅ Đã sao chép Key!";

            status.className =
                "status success";

        } catch {

            status.textContent =
                "❌ Không thể sao chép tự động.";

            status.className =
                "status error";
        }
    }
}


/* =========================
   ENTER TO SUBMIT
========================= */

document
    .getElementById("answer")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                checkAnswer();
            }

        }
    );

</script>

</body>
</html>
