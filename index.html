<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>GRX Key System</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #18234a,
            #070914 55%,
            #03040a
        );

    color: white;
}

.container {
    width: 420px;
    max-width: 92%;

    padding: 35px;

    border-radius: 22px;

    background:
        rgba(12, 15, 30, 0.95);

    border:
        1px solid rgba(100, 120, 255, 0.35);

    box-shadow:
        0 0 40px rgba(50, 70, 255, 0.25);
}

.logo {
    text-align: center;

    font-size: 34px;
    font-weight: 900;

    margin-bottom: 10px;
}

.subtitle {
    text-align: center;

    color: #9ca3af;

    margin-bottom: 30px;
}

.question {
    font-size: 22px;

    text-align: center;

    margin-bottom: 20px;
}

input {
    width: 100%;

    padding: 15px;

    border-radius: 12px;

    border:
        1px solid #30364f;

    background: #0b0e1b;

    color: white;

    outline: none;

    text-align: center;

    font-size: 18px;
}

input:focus {
    border-color: #5865f2;
}

button {
    width: 100%;

    margin-top: 15px;

    padding: 15px;

    border: 0;

    border-radius: 12px;

    background:
        linear-gradient(
            90deg,
            #5865f2,
            #7c3aed
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

.hidden {
    display: none;
}

.loading-title {
    text-align: center;

    font-size: 22px;

    margin-bottom: 20px;
}

.progress {
    width: 100%;

    height: 14px;

    background: #171a2a;

    border-radius: 20px;

    overflow: hidden;
}

.progress-bar {
    height: 100%;

    width: 0%;

    background:
        linear-gradient(
            90deg,
            #5865f2,
            #a855f7
        );

    transition: width 1s linear;
}

.percent {
    text-align: center;

    margin-top: 15px;

    color: #a5b4fc;
}

.key-box {
    margin-top: 20px;

    padding: 18px;

    background: #080b16;

    border:
        1px solid #5865f2;

    border-radius: 12px;

    text-align: center;

    font-size: 21px;

    font-weight: bold;

    word-break: break-all;

    color: #8ea0ff;
}

.copy {
    margin-top: 12px;
}

.status {
    text-align: center;

    margin-top: 15px;

    color: #9ca3af;

    font-size: 14px;
}

.error {
    color: #ff6b6b;
}

.success {
    color: #57f287;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        GRX
    </div>

    <div class="subtitle">
        Key System
    </div>

    <!-- QUESTION -->

    <div id="questionBox">

        <div class="question">
            1 + 1 bằng bao nhiêu?
        </div>

        <input
            id="answer"
            type="number"
            placeholder="Nhập đáp án"
        >

        <button onclick="checkAnswer()">
            Xác nhận
        </button>

        <div
            id="questionStatus"
            class="status"
        ></div>

    </div>

    <!-- LOADING -->

    <div
        id="loadingBox"
        class="hidden"
    >

        <div class="loading-title">
            ⚡ Đang tạo Key...
        </div>

        <div class="progress">

            <div
                id="progressBar"
                class="progress-bar"
            ></div>

        </div>

        <div
            id="percent"
            class="percent"
        >
            0%
        </div>

        <div
            id="loadingStatus"
            class="status"
        >
            Vui lòng chờ...
        </div>

    </div>

    <!-- RESULT -->

    <div
        id="resultBox"
        class="hidden"
    >

        <div class="loading-title">
            ✅ Tạo Key thành công
        </div>

        <div
            id="key"
            class="key-box"
        >
        </div>

        <button
            class="copy"
            onclick="copyKey()"
        >
            📋 Sao chép Key
        </button>

        <div
            id="copyStatus"
            class="status"
        ></div>

        <div class="status">
            Key có hiệu lực trong 10 phút.
        </div>

    </div>

</div>

<script>

/*
    QUAN TRỌNG:
    Sau khi deploy API lên Render,
    thay URL bên dưới bằng URL Render của bạn.

    Ví dụ:

    https://grx-key-api.onrender.com
*/

const API_URL =
    "https://YOUR-API-NAME.onrender.com";


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer() {

    const answer =
        document
            .getElementById("answer")
            .value
            .trim();

    const status =
        document
            .getElementById(
                "questionStatus"
            );

    if (answer !== "2") {

        status.textContent =
            "❌ Đáp án chưa đúng.";

        status.className =
            "status error";

        return;
    }

    status.textContent =
        "";

    document
        .getElementById(
            "questionBox"
        )
        .classList.add("hidden");

    document
        .getElementById(
            "loadingBox"
        )
        .classList.remove("hidden");

    startLoading();
}


/* =========================
   60 SECOND LOADING
========================= */

function startLoading() {

    let seconds = 0;

    const total = 60;

    const bar =
        document.getElementById(
            "progressBar"
        );

    const percent =
        document.getElementById(
            "percent"
        );

    const status =
        document.getElementById(
            "loadingStatus"
        );

    const timer =
        setInterval(async () => {

            seconds++;

            const value =
                Math.floor(
                    seconds / total * 100
                );

            bar.style.width =
                value + "%";

            percent.textContent =
                value + "%";

            status.textContent =
                `Đang xử lý... ${seconds}/${total} giây`;

            if (seconds >= total) {

                clearInterval(timer);

                status.textContent =
                    "🔑 Đang liên hệ máy chủ Key...";

                await getKey();
            }

        }, 1000);
}


/* =========================
   GET KEY
========================= */

async function getKey() {

    try {

        const response =
            await fetch(
                API_URL +
                "/api/get-key"
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }

        const data =
            await response.json();

        if (!data.key) {

            throw new Error(
                "API không trả về Key"
            );
        }

        document
            .getElementById(
                "loadingBox"
            )
            .classList.add(
                "hidden"
            );

        document
            .getElementById(
                "resultBox"
            )
            .classList.remove(
                "hidden"
            );

        document
            .getElementById(
                "key"
            )
            .textContent =
                data.key;

    } catch (error) {

        console.error(error);

        const status =
            document.getElementById(
                "loadingStatus"
            );

        status.textContent =
            "❌ Không thể kết nối API.";

        status.className =
            "status error";

    }
}


/* =========================
   COPY
========================= */

async function copyKey() {

    const key =
        document
            .getElementById(
                "key"
            )
            .textContent;

    const status =
        document.getElementById(
            "copyStatus"
        );

    try {

        await navigator.clipboard.writeText(
            key
        );

        status.textContent =
            "✅ Đã sao chép Key!";

        status.className =
            "status success";

    } catch {

        status.textContent =
            "❌ Không thể sao chép.";

        status.className =
            "status error";
    }
}

</script>

</body>
</html>
